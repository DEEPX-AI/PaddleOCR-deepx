[pytest]
# Pytest configuration for PaddleOCR FastAPI Service tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --color=yes

# Markers
markers =
    health: Health check tests
    baidu: Baidu AI Studio compatible API tests
    fastapi: FastAPI native endpoint tests
    batch: Batch processing tests
    docs: Documentation tests
    performance: Performance and edge case tests
    slow: Tests that take a long time to run

# Test timeout (in seconds)
timeout = 300

# Coverage options (if pytest-cov is installed)
# Uncomment to enable coverage reporting
# addopts = --cov=ocr_service --cov-report=html --cov-report=term

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
